<title>TribeSpy — Configuration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Même univers que la page d'accueil : carbone noir, acier, un seul accent vert. */
:root {
  color-scheme: dark;
  --bg: #0A0C0E; --panel: #12161A; --panel-2: #1A2026; --line: #2A323A; --steel: #A4AEB8;
  --fg: #E8ECEF; --muted: #94A0AB; --lime: #8DDE00; --lime-ink: #0B1400; --lime-glow: rgba(141, 222, 0, .22);
  --bad: #FF6B5E; --warn: #F5C451;
  --f-head: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 1rem/1.6 var(--f-body); padding-inline: 1rem;
  background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.018) 0 2px, transparent 2px 5px); }
.wrap { max-width: 62rem; margin-inline: auto; }
a { color: inherit; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--f-head); margin: 0; font-weight: 600; line-height: 1.2; }
h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 700; }
h2 { font-size: 1.2rem; }
.label { font: 600 .72rem/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--lime); }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); font-size: .85rem; }

header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .7rem 1.5rem; padding-block: 1rem; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: .65rem; text-decoration: none; font: 700 1.25rem/1 var(--f-head); }
.brand img { width: 2.3rem; height: 2.3rem; border-radius: 50%; }
.brand b { color: var(--lime); }
.tools { display: flex; align-items: center; gap: 1rem; font-size: .9rem; }
.tools a, .linkbtn { color: var(--muted); text-decoration: none; background: none; border: 0; font: inherit; cursor: pointer; padding: .25rem 0; }
.tools a:hover, .linkbtn:hover { color: var(--fg); }
.user { display: flex; align-items: center; gap: .5rem; }
.user img { width: 1.7rem; height: 1.7rem; border-radius: 50%; background: var(--panel-2); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; font: 600 .92rem/1 var(--f-head); text-decoration: none; padding: .8rem 1.2rem; border: 1px solid var(--steel); color: var(--fg); background: transparent; cursor: pointer; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sm { padding: .5rem .8rem; font-size: .85rem; }
.btn:disabled { opacity: .5; cursor: wait; }
.x { background: none; border: 1px solid transparent; color: var(--muted); cursor: pointer; font: 600 1rem/1 var(--f-mono); padding: .3rem .5rem; }
.x:hover { color: var(--bad); border-color: var(--line); }

main { padding-block: 2.2rem 3rem; display: grid; gap: 1.6rem; }
.intro { display: grid; gap: .6rem; }
.intro p { color: var(--muted); max-width: 40rem; }
.card { background: var(--panel); border: 1px solid var(--line); padding: 1.3rem 1.4rem; display: grid; gap: 1rem; min-width: 0; }
.center { justify-items: start; }

/* liste des serveurs Discord */
.guilds { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 1rem; }
.guild { background: var(--panel); border: 1px solid var(--line); padding: 1rem; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .8rem; align-items: center; }
.guild .gi { width: 3rem; height: 3rem; border-radius: 50%; background: var(--panel-2); display: grid; place-items: center; font: 700 1rem/1 var(--f-head); color: var(--steel); overflow: hidden; }
.guild .gi img { width: 100%; height: 100%; }
.guild .gn { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.guild .btn { grid-column: 1 / -1; }
.guild.off { opacity: .75; }

/* éditeur */
.ghead { display: flex; flex-wrap: wrap; align-items: center; gap: .8rem 1rem; }
.ghead .gi { width: 2.6rem; height: 2.6rem; border-radius: 50%; background: var(--panel-2); overflow: hidden; display: grid; place-items: center; font: 700 1rem/1 var(--f-head); color: var(--steel); }
.ghead .gi img { width: 100%; height: 100%; }
.tabs { display: flex; flex-wrap: wrap; gap: .3rem; border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); font: 600 .92rem/1 var(--f-head); padding: .8rem .9rem; cursor: pointer; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--lime); }
.tabs .count { font: 400 .75rem/1 var(--f-mono); color: var(--muted); margin-left: .3rem; }

.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem 1.2rem; }
.field { display: grid; gap: .35rem; min-width: 0; }
.field label { font-size: .85rem; font-weight: 500; }
.field .hint { font-size: .78rem; color: var(--muted); }
input, select { width: 100%; height: 2.75rem; font: 400 .95rem/1.3 var(--f-body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); padding: .6rem .7rem; border-radius: 0; }
input:focus, select:focus { border-color: var(--lime); outline: none; }
.row { display: flex; flex-wrap: wrap; gap: .7rem; align-items: start; }
.row > .btn { margin-top: 1.7rem; height: 2.75rem; }
.row .field { flex: 1 1 12rem; }
.actions { display: flex; flex-wrap: wrap; gap: .7rem; align-items: center; }

.list { list-style: none; margin: 0; padding: 0; display: grid; border-top: 1px solid var(--line); }
.list li { display: flex; align-items: center; gap: .8rem; padding: .6rem .2rem; border-bottom: 1px solid var(--line); min-width: 0; }
.list .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.list .empty { color: var(--muted); justify-content: center; padding-block: 1.2rem; }
.dot { width: .6rem; height: .6rem; border-radius: 50%; background: var(--muted); flex: none; }
.dot.on { background: var(--lime); box-shadow: 0 0 8px var(--lime-glow); }
.dot.off { background: var(--bad); }
.tribe { font: 600 .75rem/1 var(--f-mono); border: 1px solid var(--line); padding: .25rem .4rem; color: var(--steel); }

.msg { padding: .8rem 1rem; border: 1px solid var(--line); border-left: 4px solid var(--lime); background: var(--panel); white-space: pre-line; font-size: .92rem; }
.msg.err { border-left-color: var(--bad); }
.msg.warn { border-left-color: var(--warn); }
.toast { position: fixed; left: 50%; bottom: 1.2rem; transform: translateX(-50%); width: min(34rem, calc(100% - 2rem)); z-index: 10; box-shadow: 0 10px 30px rgba(0,0,0,.5); }

footer { border-top: 1px solid var(--line); padding-block: 1.4rem 2.2rem; color: var(--muted); font-size: .82rem; }

@media (max-width: 40rem) {
  .form { grid-template-columns: minmax(0, 1fr); }
  .tools { gap: .7rem; }
  .user span { display: none; }
}
</style>

  var T = {
    en: {
      home: "Home", logout: "Log out", loading: "Loading…", other: "Français",
      footer: "TribeSpy is an independent service, not affiliated with Studio Wildcard, Valve or Discord.",
      title: "Configuration", lead: "Set up TribeSpy for your Discord servers without typing a single command.",
      notReady: "The web console isn't switched on yet. In the meantime, use the /config commands in Discord.",
      login: "Log in with Discord",
      loginWhy: "We only ask Discord for your name and the list of your servers, to show the ones you can manage (“Manage Server” permission).",
      loginErr: "Login failed or was cancelled. Please try again.",
      pick: "Choose a Discord server", pickLead: "Servers where you have the “Manage Server” permission.",
      noGuilds: "You don't manage any Discord server. Ask an admin of your server to give you the “Manage Server” permission.",
      configure: "Configure", addBot: "Add the bot", botMissing: "Bot not added yet", refresh: "Refresh the list",
      back: "All servers", tGeneral: "General", tServers: "Game servers", tBlacklist: "Blacklist", tTribes: "Tribes",
      dash: "Dashboard channel", dashHint: "Live players, updated every minute.",
      hist: "History channel", histHint: "Connections, alerts and recaps (optional).", none: "— None —", choose: "— Choose a channel —",
      noPerm: " (missing permissions)", tz: "Time zone", tzHint: "Pick your city, sorted by region.", tzCommon: "Most used",
      lang: "Bot language", save: "Save",
      srvName: "Display name", srvNamePh: "Ragnarok", addr: "Address (IP:query port)", addrPh: "151.242.127.127:27018",
      addrHint: "Use the query port, often different from the game port. The bot checks it responds.",
      add: "Add", noServers: "No game server yet.", of: "of",
      st_online: "Online", st_offline: "Offline", st_unknown: "Waiting for the first check",
      player: "Player name (exact)", noBl: "The blacklist is empty.",
      tribe: "Tribe", setTribe: "Link", noTribes: "No tribe affiliation yet.",
      confirmSrv: "Remove the server “{x}”?", remove: "Remove",
      errAuth: "Your session has expired. Please log in again.", errForbidden: "You no longer have the “Manage Server” permission on this Discord server.",
      errGuild: "The bot is no longer on this Discord server.", errRate: "Too many changes in a short time. Wait a minute and try again.",
      errNet: "Can't reach the bot right now. It may be restarting: try again in a moment.", errField: "Please check the field.",
      errGeneric: "Something went wrong. Please try again."
    },
    fr: {
      home: "Accueil", logout: "Se déconnecter", loading: "Chargement…", other: "English",
      footer: "TribeSpy est un service indépendant, non affilié à Studio Wildcard, Valve ou Discord.",
      title: "Configuration", lead: "Réglez TribeSpy pour vos serveurs Discord sans taper une seule commande.",
      notReady: "La console web n'est pas encore activée. En attendant, utilisez les commandes /config dans Discord.",
      login: "Se connecter avec Discord",
      loginWhy: "Nous demandons seulement à Discord votre nom et la liste de vos serveurs, pour afficher ceux que vous pouvez gérer (permission « Gérer le serveur »).",
      loginErr: "La connexion a échoué ou a été annulée. Réessayez.",
      pick: "Choisissez un serveur Discord", pickLead: "Les serveurs où vous avez la permission « Gérer le serveur ».",
      noGuilds: "Vous ne gérez aucun serveur Discord. Demandez à un admin de votre serveur la permission « Gérer le serveur ».",
      configure: "Configurer", addBot: "Ajouter le bot", botMissing: "Bot pas encore ajouté", refresh: "Actualiser la liste",
      back: "Tous les serveurs", tGeneral: "Général", tServers: "Serveurs de jeu", tBlacklist: "Blacklist", tTribes: "Tribus",
      dash: "Salon du tableau de bord", dashHint: "Joueurs en ligne, mis à jour chaque minute.",
      hist: "Salon d'historique", histHint: "Connexions, alertes et bilans (facultatif).", none: "— Aucun —", choose: "— Choisir un salon —",
      noPerm: " (droits manquants)", tz: "Fuseau horaire", tzHint: "Choisissez votre ville, classée par continent.", tzCommon: "Les plus utilisés",
      lang: "Langue du bot", save: "Enregistrer",
      srvName: "Nom affiché", srvNamePh: "Ragnarok", addr: "Adresse (IP:port de requête)", addrPh: "151.242.127.127:27018",
      addrHint: "Utilisez le port de requête, souvent différent du port de jeu. Le bot vérifie qu'il répond.",
      add: "Ajouter", noServers: "Aucun serveur de jeu pour l'instant.", of: "sur",
      st_online: "En ligne", st_offline: "Hors ligne", st_unknown: "En attente du premier relevé",
      player: "Nom du joueur (exact)", noBl: "La blacklist est vide.",
      tribe: "Tribu", setTribe: "Associer", noTribes: "Aucune affiliation pour l'instant.",
      confirmSrv: "Retirer le serveur « {x} » ?", remove: "Retirer",
      errAuth: "Votre session a expiré. Reconnectez-vous.", errForbidden: "Vous n'avez plus la permission « Gérer le serveur » sur ce serveur Discord.",
      errGuild: "Le bot n'est plus sur ce serveur Discord.", errRate: "Trop de modifications d'un coup. Attendez une minute et réessayez.",
      errNet: "Impossible de joindre le bot pour le moment. Il redémarre peut-être : réessayez dans un instant.", errField: "Vérifiez le champ.",
      errGeneric: "Une erreur est survenue. Réessayez."
    }
  };
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
  var lang = store("tribespy_lang") || ((navigator.language || "").toLowerCase().indexOf("fr") === 0 ? "fr" : "en");
  if (!T[lang]) lang = "en";
  function t(k, x) { var s = T[lang][k] || T.en[k] || k; return x === undefined ? s : s.replace("{x}", x); }

  function applyStatic() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = t(el.getAttribute("data-t")); });
    var home = lang === "fr" ? "fr.html" : "index.html";
    document.getElementById("home").href = home;
    document.getElementById("back").href = home;
    document.getElementById("langBtn").textContent = t("other");
  }
  document.getElementById("langBtn").addEventListener("click", function () {
    lang = lang === "fr" ? "en" : "fr";
    store("tribespy_lang", lang);
    applyStatic();
    route();
  });

  // ---------- petits outils DOM (tout le texte passe par textContent) ----------
  function h(tag, attrs) {
    var el = document.createElement(tag);
    for (var k in (attrs || {})) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "text") el.textContent = v;
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c === null || c === undefined || c === false) continue;
      (Array.isArray(c) ? c : [c]).forEach(function (n) { if (n) el.appendChild(typeof n === "string" ? document.createTextNode(n) : n); });
    }
    return el;
  }
  var app = document.getElementById("app");
  function show() { app.textContent = ""; for (var i = 0; i < arguments.length; i++) if (arguments[i]) app.appendChild(arguments[i]); }
  var toastTimer;
  function toast(text, isErr) {
    var el = document.getElementById("toast");
    el.textContent = text; el.className = "msg toast" + (isErr ? " err" : text.indexOf("⚠") === 0 ? " warn" : ""); el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.hidden = true; }, isErr ? 8000 : 5000);
  }
  function initials(name) { return (name || "?").split(/\s+/).map(function (w) { return w[0]; }).join("").slice(0, 3).toUpperCase(); }
  function guildIcon(g) {
    var url = g.icon && g.icon.indexOf("http") === 0 ? g.icon : (g.icon ? "https://cdn.discordapp.com/icons/" + g.id + "/" + g.icon + ".png?size=96" : null);
    return h("div", { class: "gi", "aria-hidden": "true" }, url ? h("img", { src: url, alt: "" }) : initials(g.name));
  }

  // ---------- session ----------
  var token = store("tribespy_token");
  var loginError = false;
  function readLoginHash() {                     // retour de la connexion Discord : #token=… ou #error=login
    var hash = new URLSearchParams(location.hash.slice(1));
    if (!hash.get("token") && !hash.get("error")) return;
    if (hash.get("token")) { token = hash.get("token"); store("tribespy_token", token); }
    if (hash.get("error")) loginError = true;
    history.replaceState(null, "", location.pathname + location.search);
  }

  function api(method, path, body) {
    var sep = path.indexOf("?") < 0 ? "?" : "&";
    return fetch(API + path + sep + "lang=" + lang, {
      method: method,
      headers: Object.assign({ "Authorization": "Bearer " + token }, body ? { "Content-Type": "application/json" } : {}),
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (r.status === 401) { token = null; store("tribespy_token", null); renderLogin(t("errAuth")); throw { handled: true }; }
        if (!r.ok) {
          var known = { forbidden: "errForbidden", guild: "errGuild", rate: "errRate", field: "errField" };
          throw { message: known[d.error] ? t(known[d.error]) : (d.message || t("errGeneric")) };
        }
        return d;
      });
    }, function () { throw { message: t("errNet") }; });
  }
  function fail(e) { if (!e || !e.handled) toast((e && e.message) || t("errGeneric"), true); }

  document.getElementById("logout").addEventListener("click", function () {
    var tk = token;
    token = null; store("tribespy_token", null);
    if (tk) fetch(API + "/api/logout", { method: "POST", headers: { "Authorization": "Bearer " + tk } }).catch(function () {});
    setUser(null); renderLogin();
  });
  function setUser(u) {
    document.getElementById("user").hidden = !u;
    document.getElementById("logout").hidden = !u;
    if (!u) return;
    document.getElementById("uname").textContent = u.name;
    var av = document.getElementById("avatar");
    if (u.avatar) av.src = "https://cdn.discordapp.com/avatars/" + u.id + "/" + u.avatar + ".png?size=64"; else av.removeAttribute("src");
  }

  // ---------- écrans ----------
  function intro(title, lead) {
    return h("div", { class: "intro" }, h("span", { class: "label", text: "TribeSpy" }), h("h1", { text: title }), lead ? h("p", { text: lead }) : null);
  }
  function renderNotReady() { show(intro(t("title"), t("lead")), h("div", { class: "msg err", text: t("notReady") })); }
  function renderLogin(err) {
    show(intro(t("title"), t("lead")),
      err || loginError ? h("div", { class: "msg err", text: err || t("loginErr") }) : null,
      h("div", { class: "card center" },
        h("a", { class: "btn primary", href: API + "/auth/login", text: t("login") }),
        h("p", { class: "muted", text: t("loginWhy") })));
    loginError = false;
  }

  var me = null;
  function renderGuilds() {
    show(h("p", { class: "muted", text: t("loading") }));
    api("GET", "/api/me").then(function (d) {
      me = d; setUser(d.user);
      var list = d.guilds.length ? h("div", { class: "guilds" }, d.guilds.map(function (g) {
        return h("div", { class: "guild" + (g.bot ? "" : " off") },
          guildIcon(g),
          h("div", null, h("div", { class: "gn", text: g.name, title: g.name }), g.bot ? null : h("div", { class: "muted mono", text: t("botMissing") })),
          g.bot ? h("a", { class: "btn primary sm", href: "#g=" + g.id, text: t("configure") })
                : h("a", { class: "btn sm", href: g.invite_url, target: "_blank", rel: "noopener", text: t("addBot") }));
      })) : h("div", { class: "msg", text: t("noGuilds") });
      show(intro(t("pick"), t("pickLead")), list,
        h("div", { class: "actions" }, h("button", { class: "linkbtn", type: "button", text: t("refresh"), onclick: renderGuilds })));
    }).catch(function (e) {                      // ex. bot en train de démarrer : message dans la page + bouton pour réessayer
      if (e && e.handled) return;
      show(intro(t("pick"), t("pickLead")), h("div", { class: "msg err", text: (e && e.message) || t("errGeneric") }),
        h("div", { class: "actions" }, h("button", { class: "linkbtn", type: "button", text: t("refresh"), onclick: renderGuilds })));
    });
  }

  var tab = "general";
  function renderGuild(gid) {
    show(h("p", { class: "muted", text: t("loading") }));
    api("GET", "/api/guilds/" + gid).then(function (d) { drawGuild(gid, d); }).catch(function (e) { fail(e); if (!e || !e.handled) location.hash = ""; });
  }
  function reload(gid) { return api("GET", "/api/guilds/" + gid).then(function (d) { drawGuild(gid, d); }); }

  function busy(form, on) { form.querySelectorAll("button, input, select").forEach(function (el) { el.disabled = on; }); }
  function submit(form, gid, method, path, body, after) {
    busy(form, true);
    return api(method, path, body).then(function (r) {
      toast(r.message || "✓");
      return reload(gid).then(after);
    }).catch(fail).then(function () { busy(form, false); });
  }

  function drawGuild(gid, d) {
    var tabs = [["general", t("tGeneral")], ["servers", t("tServers"), d.servers.length + "/" + d.plan.max_servers],
                ["blacklist", t("tBlacklist"), d.blacklist.length], ["tribes", t("tTribes"), d.tribes.length]];
    var tabBar = h("div", { class: "tabs", role: "tablist" }, tabs.map(function (x) {
      return h("button", { type: "button", role: "tab", "aria-selected": String(tab === x[0]),
        onclick: function () { tab = x[0]; drawGuild(gid, d); } }, x[1], x[2] !== undefined ? h("span", { class: "count", text: String(x[2]) }) : null);
    }));
    var panels = { general: general, servers: servers, blacklist: blacklist, tribes: tribes };
    show(
      h("div", { class: "actions" }, h("a", { class: "linkbtn", href: "#", text: "← " + t("back") })),
      h("div", { class: "ghead" }, guildIcon(d.guild), h("h1", { text: d.guild.name })),
      h("div", { class: "card" }, tabBar, panels[tab](gid, d)));
  }

  function channelOptions(d, selected, first) {
    return [h("option", { value: "", text: first })].concat(d.channels.map(function (c) {
      return h("option", { value: c.id, selected: c.id === selected,
        text: "#" + c.name + (c.category ? "  ·  " + c.category : "") + (c.writable ? "" : t("noPerm")) });
    }));
  }

  function general(gid, d) {
    var s = d.settings;
    var dash = h("select", { id: "f-dash" }, channelOptions(d, s.channel_id, t("choose")));
    var hist = h("select", { id: "f-hist" }, channelOptions(d, s.history_channel_id, t("none")));
    // Liste déroulante groupée par continent (plus fiable qu'un champ à suggestions, surtout sur mobile).
    var common = ["Europe/Paris", "Europe/Brussels", "Europe/London", "America/Montreal", "America/New_York",
                  "America/Chicago", "America/Los_Angeles", "Australia/Sydney"];
    var groups = {};
    d.timezones.forEach(function (z) {
      var i = z.indexOf("/");
      if (i < 0 && z !== "UTC") return;
      var region = i < 0 ? "UTC" : z.slice(0, i);
      if (["Etc", "SystemV", "US", "Canada", "Brazil", "Chile", "Mexico"].indexOf(region) >= 0) return;
      (groups[region] = groups[region] || []).push(z);
    });
    function opt(z) { return h("option", { value: z, selected: z === s.tz, text: z.replace(/_/g, " ") }); }
    var tz = h("select", { id: "f-tz" },
      h("optgroup", { label: t("tzCommon") }, common.filter(function (z) { return d.timezones.indexOf(z) >= 0; }).map(opt)),
      Object.keys(groups).sort().map(function (r) { return h("optgroup", { label: r }, groups[r].map(opt)); }));
    if (!tz.querySelector("option[selected]") && s.tz) tz.insertBefore(opt(s.tz), tz.firstChild);
    var tzs = null;
    var lg = h("select", { id: "f-lang" }, [["en", "English"], ["fr", "Français"]].map(function (x) {
      return h("option", { value: x[0], selected: x[0] === s.lang, text: x[1] });
    }));
    var form = h("form", { class: "form" },
      h("div", { class: "field" }, h("label", { for: "f-dash", text: t("dash") }), dash, h("span", { class: "hint", text: t("dashHint") })),
      h("div", { class: "field" }, h("label", { for: "f-hist", text: t("hist") }), hist, h("span", { class: "hint", text: t("histHint") })),
      h("div", { class: "field" }, h("label", { for: "f-tz", text: t("tz") }), tz, tzs, h("span", { class: "hint", text: t("tzHint") })),
      h("div", { class: "field" }, h("label", { for: "f-lang", text: t("lang") }), lg),
      h("div", { class: "actions" }, h("button", { class: "btn primary", type: "submit", text: t("save") })));
    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      var body = { tz: tz.value.trim(), lang: lg.value };
      if (dash.value) { body.channel_id = dash.value; body.history_channel_id = hist.value || null; }
      submit(form, gid, "PATCH", "/api/guilds/" + gid + "/settings", body);
    });
    return form;
  }

  function addForm(fields, label, onsubmit) {
    var form = h("form", { class: "row" }, fields.map(function (f) {
      return h("div", { class: "field" }, h("label", { for: f.id, text: f.label }),
        h("input", { id: f.id, placeholder: f.ph || "", maxlength: f.max, required: true, autocomplete: "off" }),
        f.hint ? h("span", { class: "hint", text: f.hint }) : null);
    }), h("button", { class: "btn primary", type: "submit", text: label }));
    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      var vals = {}; fields.forEach(function (f) { vals[f.key] = form.querySelector("#" + f.id).value.trim(); });
      onsubmit(form, vals);
    });
    return form;
  }
  function list(items, empty, row) {
    return h("ul", { class: "list" }, items.length ? items.map(row) : h("li", { class: "empty", text: empty }));
  }
  function removeBtn(label, fn) { return h("button", { class: "x", type: "button", title: t("remove") + " " + label, "aria-label": t("remove") + " " + label, text: "✕", onclick: fn }); }
  function del(btn, gid, path) {
    btn.disabled = true;
    api("DELETE", path).then(function (r) { toast(r.message || "✓"); return reload(gid); }).catch(function (e) { btn.disabled = false; fail(e); });
  }

  function servers(gid, d) {
    return h("div", { style: "display:grid;gap:1.2rem" },
      list(d.servers, t("noServers"), function (s) {
        return h("li", null, h("span", { class: "dot " + (s.status === "online" ? "on" : s.status === "offline" ? "off" : ""), title: t("st_" + s.status) }),
          h("div", { class: "grow" }, h("b", { text: s.name }), " ", h("span", { class: "muted mono", text: s.address })),
          h("span", { class: "muted", text: t("st_" + s.status) }),
          removeBtn(s.name, function (ev) { if (confirm(t("confirmSrv", s.name))) del(ev.currentTarget, gid, "/api/guilds/" + gid + "/servers?name=" + encodeURIComponent(s.name)); }));
      }),
      d.servers.length < d.plan.max_servers ? addForm([
        { id: "f-sn", key: "name", label: t("srvName"), ph: t("srvNamePh"), max: 32 },
        { id: "f-sa", key: "address", label: t("addr"), ph: t("addrPh"), max: 260, hint: t("addrHint") }
      ], t("add"), function (form, v) { submit(form, gid, "POST", "/api/guilds/" + gid + "/servers", v); }) : null);
  }

  function blacklist(gid, d) {
    return h("div", { style: "display:grid;gap:1.2rem" },
      list(d.blacklist, t("noBl"), function (p) {
        return h("li", null, h("span", { class: "dot off" }), h("div", { class: "grow", text: p }),
          removeBtn(p, function (ev) { del(ev.currentTarget, gid, "/api/guilds/" + gid + "/blacklist?player=" + encodeURIComponent(p)); }));
      }),
      addForm([{ id: "f-bp", key: "player", label: t("player"), max: 64 }], t("add"),
        function (form, v) { submit(form, gid, "POST", "/api/guilds/" + gid + "/blacklist", v); }));
  }

  function tribes(gid, d) {
    return h("div", { style: "display:grid;gap:1.2rem" },
      list(d.tribes, t("noTribes"), function (x) {
        return h("li", null, h("span", { class: "tribe", text: "[" + x.tribe + "]" }), h("div", { class: "grow", text: x.player }),
          removeBtn(x.player, function (ev) { del(ev.currentTarget, gid, "/api/guilds/" + gid + "/tribes?player=" + encodeURIComponent(x.player)); }));
      }),
      addForm([{ id: "f-tp", key: "player", label: t("player"), max: 64 }, { id: "f-tt", key: "tribe", label: t("tribe"), max: 32 }], t("setTribe"),
        function (form, v) { submit(form, gid, "POST", "/api/guilds/" + gid + "/tribes", v); }));
  }

  // ---------- navigation ----------
  function route() {
    if (!API) return renderNotReady();
    readLoginHash();
    var m = /^#g=(\d+)$/.exec(location.hash);
    if (!token) {                                // lien « Configurer sur le site » depuis Discord : on y revient après la connexion
      if (m) store("tribespy_next", m[1]);
      setUser(null); return renderLogin();
    }
    var next = store("tribespy_next");
    if (next && !m) { store("tribespy_next", null); location.hash = "g=" + next; return; }
    if (m) {
      renderGuild(m[1]);
      if (!me) api("GET", "/api/me").then(function (d) { me = d; setUser(d.user); }).catch(function () {});
    } else { tab = "general"; renderGuilds(); }
  }
  window.addEventListener("hashchange", route);
  applyStatic();
  route();
})();
</script>
</body>
